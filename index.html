<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0}[hidden]{display:none!important}</style>
<title>Dart 주관식 퀴즈</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@400;700&display=swap">
<style>
/* Layout: one answer-sheet card at a time, filter chips above, score strip on top */
:root{
  --bg:#f3f5f4; --surface:#ffffff; --fg:#1a2230; --muted:#5d6876; --line:#d9dfe3;
  --accent:#0b7480; --accent-soft:#e0f0f1; --code:#eef2f3;
  --ok:#237a3b; --ok-soft:#e3f3e7; --bad:#b3362a; --bad-soft:#fbe7e4;
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"JetBrains Mono","D2Coding",Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11161c; --surface:#1a2129; --fg:#e4e9ee; --muted:#97a3b0; --line:#2c3641;
  --accent:#4cc3cd; --accent-soft:#163238; --code:#141a21;
  --ok:#6fd08a; --ok-soft:#173022; --bad:#ff8a7a; --bad-soft:#3a1d1a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11161c; --surface:#1a2129; --fg:#e4e9ee; --muted:#97a3b0; --line:#2c3641;
  --accent:#4cc3cd; --accent-soft:#163238; --code:#141a21;
  --ok:#6fd08a; --ok-soft:#173022; --bad:#ff8a7a; --bad-soft:#3a1d1a; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.55}
.wrap{max-width:720px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 16px}
h1{font-size:1.45rem;margin:0;letter-spacing:-.02em;text-wrap:balance}
.sub{color:var(--muted);font-size:.85rem;margin:2px 0 0}
.score{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:.9rem;display:flex;gap:12px}
.score b{color:var(--ok)} .score i{font-style:normal;color:var(--bad);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{font:inherit;font-size:.82rem;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:5px 11px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface);font-weight:700}
.chip:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.spacer{flex:1}
.bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--accent);transition:width .25s}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.meta{display:flex;justify-content:space-between;gap:8px;font-size:.78rem;color:var(--muted);letter-spacing:.04em}
.num{font-family:var(--mono);font-weight:700;color:var(--accent)}
.q{font-size:1.08rem;font-weight:500;margin:0;text-wrap:pretty}
pre{margin:0;background:var(--code);border:1px solid var(--line);border-radius:6px;padding:10px 12px;font-family:var(--mono);font-size:.86rem;overflow-x:auto;line-height:1.5}
.row{display:flex;gap:8px}
#ans{flex:1;min-width:0;font:inherit;font-family:var(--mono);font-size:1rem;padding:10px 12px;border:1.5px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg)}
#ans:disabled{opacity:.75}
.btn{font:inherit;font-weight:700;border:0;border-radius:6px;padding:10px 16px;cursor:pointer;background:var(--accent);color:var(--surface);white-space:nowrap}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line);font-weight:500}
.result{border-radius:6px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.result.ok{background:var(--ok-soft)} .result.bad{background:var(--bad-soft)}
.verdict{font-weight:700} .ok .verdict{color:var(--ok)} .bad .verdict{color:var(--bad)}
.correct{font-family:var(--mono);font-weight:700;white-space:pre-wrap}
.explain{color:var(--fg);font-size:.92rem}
.actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
.hint{font-size:.78rem;color:var(--muted)}
.end h2{margin:0;font-size:1.2rem}
.big{font-family:var(--mono);font-size:2rem;font-weight:700;color:var(--accent)}
.wrong-list{margin:0;padding-left:18px;font-size:.9rem;color:var(--muted)}
kbd{font-family:var(--mono);font-size:.75rem;border:1px solid var(--line);border-radius:3px;padding:0 4px}
@media (prefers-reduced-motion:reduce){.bar span{transition:none}}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div>
      <h1>Dart · Flutter 주관식 퀴즈</h1>
      <p class="sub">2026-2 중간종합평가 범위 · 답을 직접 입력하면 자동 채점</p>
    </div>
    <div class="score" aria-live="polite"><span>정답 <b id="sOk">0</b></span><span>오답 <i id="sBad">0</i></span><span id="sPos">1 / 1</span></div>
  </header>

  <div class="chips" id="chips" role="group" aria-label="범위 선택"></div>
  <div class="bar"><span id="bar" style="width:0"></span></div>

  <section class="card" id="card">
    <div class="meta"><span>시험 <span class="num" id="qnum"></span>번</span><span id="qcat"></span></div>
    <p class="q" id="qtext"></p>
    <pre id="qcode" hidden></pre>
    <form class="row" id="form" autocomplete="off">
      <input id="ans" type="text" placeholder="답을 입력하세요" aria-label="답 입력" spellcheck="false">
      <button class="btn" id="submit" type="submit">채점</button>
    </form>
    <div class="result" id="result" hidden>
      <div class="verdict" id="verdict"></div>
      <div>정답 <span class="correct" id="correct"></span></div>
      <div class="explain" id="explain"></div>
    </div>
    <div class="actions">
      <button class="btn ghost" id="override" type="button" hidden>내 답도 맞음</button>
      <button class="btn ghost" id="skip" type="button">모르겠음</button>
      <button class="btn" id="next" type="button" hidden>다음 문제</button>
    </div>
    <p class="hint">대소문자와 띄어쓰기, 쉼표, 따옴표는 채점에서 무시해요. 채점 후 <kbd>Enter</kbd>로 다음 문제.</p>
  </section>

  <section class="card end" id="end" hidden>
    <h2>다 풀었어요</h2>
    <div class="big" id="endScore"></div>
    <ol class="wrong-list" id="wrongList"></ol>
    <div class="actions">
      <button class="btn ghost" id="retryAll" type="button">처음부터 다시</button>
      <button class="btn" id="retryWrong" type="button">오답만 다시</button>
    </div>
  </section>
</div>

<script>
const CATS={d:"Dart 기초",n:"Null Safety",w:"위젯",s:"상태 관리",f:"오류 수정"};

[1,"d","자료형을 명시하지 않고, 초기화한 값으로 자료형을 추론하게 하는 키워드는?","",["var"],"var로 선언하면 처음 넣은 값으로 타입이 정해지고, 이후 다른 타입은 넣을 수 없어요."],

[8,"d","사용된 데이터 타입은?","var user = {'name': 'Kim', 'age': 20};",["map","map<string,object>"],"{ key : value } 형태는 Map."],

[12,"n","출력되는 값은?","String? name;\nprint(name ?? 'Guest');",["guest"],"name이 null이라 ?? 오른쪽 'Guest'."],

const norm=s=>s.toLowerCase().replace(/\(\)/g,"").replace(/[\s,'"`‘’“”;\/]/g,"").replace(/(입니다|이다|요)$/,"");
const $=id=>document.getElementById(id);
let filter="all", order=[], pos=0, ok=0, bad=0, wrong=[], graded=false;

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function pool(){return Q.map((_,i)=>i).filter(i=>filter==="all"||Q[i][1]===filter)}
function start(list){order=shuffle(list||pool());pos=0;ok=0;bad=0;wrong=[];$("end").hidden=true;$("card").hidden=false;show()}

function renderChips(){
  const c=$("chips");c.innerHTML="";
  [["all","전체"],...Object.entries(CATS)].forEach(([k,v])=>{
    const n=k==="all"?Q.length:Q.filter(q=>q[1]===k).length;
    const b=document.createElement("button");b.className="chip";b.type="button";b.id="chip-"+k;
    b.textContent=`${v} ${n}`;b.setAttribute("aria-pressed",filter===k);
    b.onclick=()=>{filter=k;renderChips();start()};c.appendChild(b);
  });
}
function show(){
  graded=false;const q=Q[order[pos]];
  $("qnum").textContent=q[0];$("qcat").textContent=CATS[q[1]];$("qtext").textContent=q[2];
  $("qcode").hidden=!q[3];$("qcode").textContent=q[3];
  $("ans").value="";$("ans").disabled=false;$("submit").hidden=false;$("skip").hidden=false;
  $("result").hidden=true;$("next").hidden=true;$("override").hidden=true;
  $("ans").placeholder=/순서대로/.test(q[2])?"띄어쓰기로 구분해 입력 (예: 2 1)":"답을 입력하세요";
  updateScore();$("ans").focus();
}
function updateScore(){
  $("sOk").textContent=ok;$("sBad").textContent=bad;
  $("sPos").textContent=`${Math.min(pos+1,order.length)} / ${order.length}`;
  $("bar").style.width=(pos/order.length*100)+"%";
}
function isRight(q,input){
  const a=norm(input);if(!a)return false;
  if(q[4].some(x=>norm(x)===a))return true;
  return (q[6]||[]).some(k=>a.includes(norm(k)));
}
function grade(skipped){
  if(graded)return;graded=true;const q=Q[order[pos]];
  const right=!skipped&&isRight(q,$("ans").value);
  if(right)ok++;else{bad++;wrong.push(order[pos])}
  const r=$("result");r.hidden=false;r.className="result "+(right?"ok":"bad");
  $("verdict").textContent=right?"정답이에요":(skipped?"건너뛰었어요":"아쉬워요, 오답");
  $("correct").textContent=q[4][0]==="21"?"2, 1":q[4][0]==="-14"?"-1, 4":q[4][0]==="1512"?"15, 12":displayAns(q);
  $("explain").textContent=q[5];
  $("ans").disabled=true;$("submit").hidden=true;$("skip").hidden=true;$("next").hidden=false;
  $("override").hidden=right||skipped;updateScore();$("next").focus();
}
function displayAns(q){
  const m={"set":"Set","map":"Map","kim":"Kim","guest":"Guest","unknown":"UNKNOWN","login":"Login","flutter":"Flutter","helloflutter":"Hello Flutter",
  "materialapp":"MaterialApp","scaffold":"Scaffold","column":"Column","row":"Row","center":"Center","layoutbuilder":"LayoutBuilder",
  "statefulwidget":"StatefulWidget","statelesswidget":"StatelessWidget","setstate":"setState()","initstate":"initState()","dispose":"dispose()",
  "expanded":"Expanded","mainaxisalignment.center":"MainAxisAlignment.center","children":"children","익명함수":"익명 함수 (anonymous function)",
  "intnumber=100":"int number = 100;","intcount=10":"int count = 10;","print(name?.length??0)":"print(name?.length ?? 0);",
  "print(numbers[2])":"print(numbers[2]);","doubleaverage(inta,intb){":"double average(int a, int b) {","widgetbuild(buildcontextcontext)":"@override\nWidget build(BuildContext context)",
  "setstate({count++})":"setState(() { count++; });","onpressed:printhello":"onPressed: printHello,","int?age=null":"int? age = null;",
  "런타임오류":"런타임 오류","name?.length":"name?.length 또는 name!.length","세로":"세로 (위 → 아래) A, B, C","가로":"가로 (왼 → 오) A, B","[2,4,6]":"[2, 4, 6]",
  "[6,8]":"[6, 8]","[1,2,3]":"[1, 2, 3]","[20,40]":"[20, 40]","위젯":"위젯 (Widget)","string?":"? → String? name","!":"! (null 단언 연산자)","??":"?? (null 대체 연산자)"};
  const k=q[4][0];return m[k]||k;
}
function next(){pos++;if(pos>=order.length)finish();else show()}
function finish(){
  $("card").hidden=true;$("end").hidden=false;$("bar").style.width="100%";
  $("sPos").textContent=`${order.length} / ${order.length}`;
  $("endScore").textContent=`${ok} / ${order.length}`;
  const wl=$("wrongList");wl.innerHTML="";
  wrong.forEach(i=>{const li=document.createElement("li");li.textContent=`${Q[i][0]}번 · ${Q[i][2]}`;wl.appendChild(li)});
  $("retryWrong").hidden=!wrong.length;
}
$("form").addEventListener("submit",e=>{e.preventDefault();if(!graded)grade(false)});
$("skip").onclick=()=>grade(true);
$("next").onclick=next;
$("override").onclick=()=>{bad--;ok++;wrong.pop();const r=$("result");r.className="result ok";$("verdict").textContent="정답으로 처리했어요";$("override").hidden=true;updateScore();$("next").focus()};
$("retryAll").onclick=()=>start();
$("retryWrong").onclick=()=>start(wrong.slice());
renderChips();start();
</script>
